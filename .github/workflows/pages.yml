name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import WH3 public datasets
        shell: bash
        run: |
          set -euo pipefail
          WH3_DUMP_REF="61d4e117f669ea93d6da1077d1524c332d5e74c9"
          GAME_VERSION="WH3 data dump ${WH3_DUMP_REF}"
          SOURCE_REF="Shazbot/WH3-Dump@${WH3_DUMP_REF}"
          mkdir -p .cache/wh3/scripts .cache/wh3/db data/generated data/runtime

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Shazbot/WH3-Dump/${WH3_DUMP_REF}/db/campaign_cultural_relations_tables/data__.tsv" \
            --output .cache/wh3/campaign_cultural_relations.tsv
          python tools/import_cultural_relations.py \
            --input .cache/wh3/campaign_cultural_relations.tsv \
            --output data/generated/cultural-relations.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}" \
            --source-ref "${SOURCE_REF}"

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Shazbot/WH3-Dump/${WH3_DUMP_REF}/db/frontend_faction_leaders_tables/data__.tsv" \
            --output .cache/wh3/frontend_faction_leaders.tsv
          python tools/import_frontend_leaders.py \
            --input .cache/wh3/frontend_faction_leaders.tsv \
            --output data/generated/frontend-leaders.json \
            --game-version "${GAME_VERSION}" \
            --source-ref "${SOURCE_REF}"

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Shazbot/WH3-Dump/${WH3_DUMP_REF}/script/campaign/main_warhammer/faction_intro/main_warhammer_faction_intro.lua" \
            --output .cache/wh3/scripts/main_warhammer_faction_intro.lua
          python tools/import_campaign_start_positions.py \
            --scripts-dir .cache/wh3/scripts \
            --output data/generated/campaign-start-positions.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}"

          for table in \
            effect_bonus_value_faction_junctions_tables \
            effect_bonus_value_subculture_junctions_tables \
            factions_tables; do
            mkdir -p ".cache/wh3/db/${table}"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/Shazbot/WH3-Dump/${WH3_DUMP_REF}/db/${table}/data__.tsv" \
              --output ".cache/wh3/db/${table}/data__.tsv"
          done

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Shazbot/WH3-Dump/${WH3_DUMP_REF}/db/effect_bundles_to_effects_junctions_tables/data__.tsv" \
            --output .cache/wh3/effect_bundles_to_effects.tsv

          python tools/resolve_diplomatic_effect_targets.py \
            --db-dir .cache/wh3/db \
            --output data/generated/diplomatic-effect-targets.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}"

          python tools/resolve_diplomatic_effect_values.py \
            --bundles .cache/wh3/effect_bundles_to_effects.tsv \
            --targets data/generated/diplomatic-effect-targets.json \
            --output data/generated/diplomatic-effect-values.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}"

          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/Shazbot/WH3-Dump.git .cache/wh3-dump
          git -C .cache/wh3-dump sparse-checkout init --cone
          git -C .cache/wh3-dump sparse-checkout set script/campaign
          git -C .cache/wh3-dump checkout --quiet "${WH3_DUMP_REF}"
          python tools/resolve_script_effect_bundle_sources.py \
            --scripts-dir .cache/wh3-dump/script/campaign \
            --output data/generated/script-effect-bundle-sources.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}" \
            --exclude-prefix wh3_main_chaos \
            --exclude-prefix wh3_main_prologue

          python tools/resolve_turn1_diplomatic_modifier_candidates.py \
            --script-sources data/generated/script-effect-bundle-sources.json \
            --effect-values data/generated/diplomatic-effect-values.json \
            --output data/generated/turn1-diplomatic-modifier-candidates.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}"

          python tools/resolve_verified_turn1_diplomatic_modifiers.py \
            --candidates data/generated/turn1-diplomatic-modifier-candidates.json \
            --output data/generated/verified-turn1-diplomatic-modifiers.json \
            --campaign wh3_main_combi \
            --game-version "${GAME_VERSION}"

          for file in \
            immortal-empires-startpos.json \
            frontend-leaders.json \
            campaign-start-positions.json \
            cultural-relations.json \
            diplomatic-effect-targets.json \
            diplomatic-effect-values.json \
            script-effect-bundle-sources.json \
            turn1-diplomatic-modifier-candidates.json \
            verified-turn1-diplomatic-modifiers.json; do
            cp "data/generated/${file}" "data/runtime/${file}"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('data/runtime').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY

      - name: Persist generated data for branch-based Pages fallback
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for file in \
            data/generated/frontend-leaders.json \
            data/generated/campaign-start-positions.json \
            data/generated/cultural-relations.json \
            data/generated/diplomatic-effect-targets.json \
            data/generated/diplomatic-effect-values.json \
            data/generated/script-effect-bundle-sources.json \
            data/generated/turn1-diplomatic-modifier-candidates.json \
            data/generated/verified-turn1-diplomatic-modifiers.json; do
            if ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add "$file"
              changed=1
            fi
          done
          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: persist generated WH3 Pages data"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
